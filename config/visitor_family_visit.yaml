# UK Standard Visitor - family visit with a settled UK relative.
# Rule data from Doraemon's research (docs/visa-agent-poc-research.md), 2026-08-22.
# Provenance ids resolve against config/sources.yaml.
#
# HARD RULE: no requirement may assert a legal threshold that the Rules do not set.
# In particular there is NO statutory minimum funds figure for visitors -- see
# research §2.4. Anything resembling "you need £X" is forbidden here.

route_id: visitor_family_visit
route_label: Standard Visitor (family visit)
config_version: 1.0.0
data_status: VERIFIED

# The four limbs of the genuine visitor test. These are what every risk factor and
# evidence item ultimately maps back to, so a client can always be told *why*.
genuine_visitor_test:
  - id: will_leave
    limb: "V 4.2(a)"
    text: "will leave the UK at the end of their visit"
    source: appendix_v
  - id: no_de_facto_residence
    limb: "V 4.2(b)"
    text: "will not live in the UK for extended periods through frequent or successive visits, or make the UK their main home"
    source: appendix_v
  - id: permitted_purpose
    limb: "V 4.2(c)"
    text: "is genuinely seeking entry for a purpose permitted by the visitor routes"
    source: appendix_v
  - id: sufficient_funds
    limb: "V 4.2(d)"
    text: "will have sufficient funds to cover all reasonable costs without working or accessing public funds"
    source: appendix_v

intake_slots:
  - id: applicant_name
    question: "To start, what's your full name exactly as it appears in your passport?"
    prompt_hint: full name exactly as printed in the passport
    type: text
  - id: nationality
    question: "What nationality is your passport?"
    prompt_hint: passport nationality
    type: text
  - id: trip_start
    question: "What date are you planning to arrive in the UK?"
    prompt_hint: intended arrival date in the UK
    type: date
  - id: trip_end
    question: "And what date do you plan to leave the UK?"
    prompt_hint: intended departure date from the UK
    type: date
  - id: visit_purpose
    question: "What's the main purpose of your visit?"
    prompt_hint: purpose of the visit
    type: enum
    values: [family_visit, tourism, business, medical, study_short]
  - id: has_uk_settled_relative
    question: "Do you have a relative in the UK who is British or settled there, and will you be staying with them?"
    prompt_hint: whether a settled or British relative in the UK is hosting them
    type: bool
  - id: employment_status
    question: "What's your current work situation - employed, self-employed, studying, retired, or not currently working?"
    prompt_hint: employed / self-employed / student / retired / unemployed
    type: enum
    values: [employed, self_employed, student, retired, unemployed]
  - id: third_party_funding
    question: "Is anyone else paying for this trip, or are you funding it yourself?"
    prompt_hint: whether someone else is paying for the trip
    type: bool
  - id: prior_uk_refusal
    question: "Have you ever been refused a visa by the UK or any other country?"
    prompt_hint: whether they have ever been refused a UK visa or any other country's visa
    type: bool
  - id: estimated_trip_cost_gbp
    question: "Roughly what do you expect the whole trip to cost in pounds, including flights, accommodation and spending money?"
    prompt_hint: rough total cost of the trip in GBP (flights, accommodation, living costs)
    type: number

evidence:
  - id: passport
    label: Passport biographic page (plus previous visa pages)
    category: identity
    required: always
    why: "Send the passport page with your photo and personal details. If you have previous visas or entry stamps from the UK or other countries, include clear copies of those pages too."
    source: caseworker_guidance
    extract: [holder_name, passport_number, expiry_date, nationality, prior_compliant_travel]
    checks:
      - kind: field_present
        fields: [holder_name, passport_number, expiry_date]
      - kind: name_matches
        field: holder_name
        slot: applicant_name
      - kind: date_after
        field: expiry_date
        relative_to_slot: trip_end
        note: "passport should remain valid for the whole stay"
        source: industry_practice

  - id: bank_statements
    label: Personal bank statements (recent months)
    category: funds
    required: always
    why: "Send recent personal bank statements showing the account holder name, statement start and end dates, transactions, and closing balance."
    source: appendix_v
    extract: [account_holder_name, period_start, period_end, closing_balance, currency]
    checks:
      - kind: field_present
        fields: [account_holder_name, period_start, period_end, closing_balance]
      - kind: name_matches
        field: account_holder_name
        slot: applicant_name
      # 6 months is practitioner practice, not a legal requirement. Labelled so the
      # client is never told that practice is law.
      - kind: covers_days
        start_field: period_start
        end_field: period_end
        min_days: 180
        advisory: true
        note: "6 months is common practice, not a legal requirement"
        source: industry_practice
      - kind: recent_within_days
        field: period_end
        max_age_days: 31
        advisory: true
        note: "statements should be recent at the point of application"
        source: industry_practice

  - id: travel_itinerary
    label: Travel booking or itinerary showing return travel
    category: itinerary
    required: always
    why: "Send a flight booking, reservation, or planned itinerary showing your outbound and return travel dates. Include the passenger name if it is shown on the document."
    source: supporting_docs
    extract: [outbound_date, return_date, passenger_name]
    checks:
      - kind: field_present
        fields: [outbound_date, return_date]
      - kind: name_matches
        field: passenger_name
        slot: applicant_name
      - kind: date_before
        field: outbound_date
        relative_to_field: return_date
      - kind: date_matches_slot
        field: return_date
        slot: trip_end
        tolerance_days: 3
        advisory: true
        note: "itinerary return date should line up with the stated departure date"
        source: caseworker_guidance

  - id: accommodation_proof
    label: Proof of where you will stay
    category: itinerary
    required: always
    why: "Send a hotel booking, accommodation confirmation, or host address showing the UK address where you plan to stay."
    source: supporting_docs
    extract: [address, host_name, stay_start, stay_end]
    checks:
      - kind: field_present
        fields: [address]

  - id: sponsor_invitation_letter
    label: Invitation letter from your UK relative
    category: sponsorship
    required_when:
      slot: has_uk_settled_relative
      equals: true
    why: "Send a letter from your UK relative showing their name, address, and relationship to you. Include visit dates, accommodation arrangements, and financial support details if relevant."
    source: caseworker_guidance
    extract: [sponsor_name, sponsor_address, relationship, stay_start, stay_end, funding_offered]
    checks:
      - kind: field_present
        fields: [sponsor_name, sponsor_address, relationship]
      - kind: cross_document_consistency
        field: sponsor_name
        other_evidence: sponsor_status_proof
        other_field: sponsor_name
        note: "sponsor named in the invitation must be the sponsor whose status is evidenced"
        source: caseworker_guidance

  - id: sponsor_status_proof
    label: Proof of your sponsor's UK immigration status
    category: sponsorship
    required_when:
      slot: has_uk_settled_relative
      equals: true
    why: "Send a copy of your UK relative's British passport, biometric residence permit, eVisa/share-code evidence, or other proof showing their name and UK status."
    source: supporting_docs
    extract: [sponsor_name, status_type]
    checks:
      - kind: field_present
        fields: [sponsor_name, status_type]

  - id: sponsor_financial_evidence
    label: Your sponsor's bank statements
    category: sponsorship
    required_when:
      slot: third_party_funding
      equals: true
    why: "Send your sponsor's recent bank statements showing the account holder name, statement start and end dates, transactions, and closing balance."
    source: caseworker_guidance
    extract: [account_holder_name, period_start, period_end, closing_balance, currency]
    checks:
      - kind: field_present
        fields: [account_holder_name, period_start, period_end, closing_balance]

  - id: employment_letter
    label: Employer letter confirming employment and approved leave
    category: home_ties
    required_when:
      slot: employment_status
      equals: employed
    why: "Send an employer letter showing your employer name and job title. Include salary, approved leave dates, and expected return-to-work date if available."
    source: caseworker_guidance
    extract: [employer_name, job_title, leave_start, leave_end, annual_salary]
    checks:
      - kind: field_present
        fields: [employer_name, job_title]
      - kind: date_matches_slot
        field: leave_end
        slot: trip_end
        tolerance_days: 7
        advisory: true
        note: "approved leave should cover the intended trip"
        source: industry_practice

  - id: self_employment_evidence
    label: Business registration, tax records and business bank statements
    category: home_ties
    required_when:
      slot: employment_status
      equals: self_employed
    why: "Send documents showing your business name, registration number, recent tax year and declared income, plus business bank statement start and end dates."
    source: caseworker_guidance
    extract: [business_name, registration_id, tax_year, declared_income, business_statement_period_start, business_statement_period_end]
    checks:
      - kind: field_present
        fields: [business_name, registration_id, tax_year, declared_income, business_statement_period_start, business_statement_period_end]

  - id: home_ties_evidence
    label: Evidence of your ties to your home country (property, family, dependants, studies)
    category: home_ties
    required: always
    why: "Send documents that show the type of home-country ties you want us to record, such as property, family or dependant responsibilities, studies, or other ongoing obligations."
    source: caseworker_guidance
    extract: [tie_types]
    checks:
      - kind: field_present
        fields: [tie_types]

# Risk factors. These are OBSERVATIONS with a remediation question attached.
# They never carry a score, a probability, or a sufficiency verdict -- see
# research §5.2 defence 6. `ask` is the only client-facing sentence permitted.
risk_factors:
  - id: settled_relative_in_uk
    label: Settled relative in the UK
    trigger:
      slot: has_uk_settled_relative
      equals: true
    relates_to: [will_leave]
    observation: >-
      Caseworker guidance lists an applicant who has few family or economic ties at
      home but several relatives in the UK as a circumstance that raises doubt about
      the intention to leave.
    ask: >-
      Because you have family settled in the UK, it helps to show clearly what keeps
      you anchored at home. Besides your work, do you have property, dependants, or
      other family in your home country we can evidence?
    source: caseworker_guidance

  - id: irregular_income
    label: Self-employed or irregular income
    trigger:
      slot: employment_status
      in: [self_employed, unemployed]
    relates_to: [sufficient_funds, will_leave]
    observation: >-
      Self-employment, recent job changes and irregular income are documented as
      higher-scrutiny circumstances because the economic tie is harder to evidence.
    ask: >-
      For self-employed applicants it usually helps to show the business is ongoing:
      registration, tax records, and business account statements. Can you provide those?
    source: caseworker_guidance

  - id: long_stay
    label: Long stay relative to a typical visit
    trigger:
      computed: stay_length_days
      gt: 60
    relates_to: [will_leave, no_de_facto_residence]
    observation: >-
      Length of stay and the pattern of time spent in the UK over the previous 12
      months are explicit assessment factors. A long stay invites questions about
      how the applicant supports themselves and why they can be away that long.
    ask: >-
      You are planning a fairly long stay. It helps to explain why the visit needs
      to be that long, and to show how your commitments at home continue while you
      are away. Can you tell me more about both?
    source: caseworker_guidance

  - id: third_party_funded
    label: Trip funded by someone else
    trigger:
      slot: third_party_funding
      equals: true
    relates_to: [sufficient_funds]
    observation: >-
      Third-party support is permitted, but the caseworker considers whether the
      relationship is genuine and whether the funder can support both parties.
    ask: >-
      Since someone else is funding the trip, we should evidence your relationship
      with them and their ability to support both of you. Can you provide their
      statements and something showing your ongoing contact?
    source: caseworker_guidance

  - id: prior_refusal
    label: Previous visa refusal
    trigger:
      slot: prior_uk_refusal
      equals: true
    relates_to: [will_leave, no_de_facto_residence]
    observation: >-
      A previous refusal or removal by any country is a negative factor the
      caseworker will weigh, and previous immigration history must be disclosed.
    ask: >-
      You mentioned a previous refusal. We need the refusal notice so the new
      application addresses those reasons directly rather than repeating them.
    source: caseworker_guidance

  - id: thin_home_ties
    label: Few evidenced ties to the home country
    trigger:
      computed: home_tie_coverage
      lt: 2
    relates_to: [will_leave]
    observation: >-
      Personal and economic ties to the country of residence are a core assessment
      factor; where few are evidenced the will-leave limb rests on little.
    ask: >-
      At the moment we have very little evidencing your ties at home. Property,
      dependants, ongoing studies, or care responsibilities all help. What applies to you?
    source: caseworker_guidance

home_ties:
  - id: employment_tie
    label: Employment or business in the home country
    satisfied_by:
      - evidence: employment_letter
        fields: [employer_name, job_title]
      - evidence: self_employment_evidence
        fields: [business_name, registration_id, tax_year, declared_income, business_statement_period_start, business_statement_period_end]
  - id: family_tie
    label: Immediate family or dependants remaining in the home country
    satisfied_by:
      - evidence: home_ties_evidence
        field: tie_types
        contains_any: [dependant, dependent, child, children, parent, mother, father, spouse, family]
  - id: property_tie
    label: Property or significant assets in the home country
    satisfied_by:
      - evidence: home_ties_evidence
        field: tie_types
        contains_any: [property, apartment, mortgage, house, flat, asset, land]
  - id: travel_history_tie
    label: Prior travel history showing visa compliance
    satisfied_by:
      - evidence: passport
        field: prior_compliant_travel
        equals: true
